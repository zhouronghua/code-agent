# CodeAgent Configuration Template
# Copy this file to one of the following locations:
#   - ./config.yaml              (project-level, highest priority)
#   - ~/.codeagent/config.yaml   (global, shared across projects)
#
# Model definitions are in models.json (CodeBuddy-compatible format).
#   - ~/.codeagent/models.json   (global)
#   - ./models.json              (project-level)
#
# You can override specific model params in the profiles section below.
# profile values take precedence over models.json entries.

# Active profile — must match an "id" in models.json
active_profile: openai

# Override model params here (optional, takes precedence over models.json)
# profiles:
#   deepseek-v4-pro:
#     temperature: 0.5

# Model routing — automatically select & switch models per prompt within a session.
# Scenarios are detected from the prompt: 'vision' | 'reasoning' | 'fast'.
# Each scenario maps to a model id (models.json) or a profile name (above).
# When this section is present, routing is enabled by default (set enabled: false to disable).
# model_routing:
#   enabled: true
#   default: deepseek-v4-flash          # fallback model for unmatched scenarios
#   scenarios:
#     reasoning: deepseek-v4-pro        # complex refactor/debug/architecture tasks
#     vision: deepseek-v4-flash-vision-exp  # image/screenshot understanding
#     fast: deepseek-v4-flash           # simple/quick tasks

# Agent settings
agent:
  max_steps: 999999
  max_context_tokens: 200000
  temperature: 0
  step_timeout: 120000    # 2 min (reasoning models need more time for tool execution)
  task_timeout: 600000     # 10 min

# Skills directories (Cursor-compatible SKILL.md files)
# The agent scans these directories for skill definitions.
# Each skill is a directory containing a SKILL.md file with frontmatter.
skills:
  - ~/.cursor/skills
  - ~/.cursor/skills-cursor
  - .cursor/skills

# Rules directories (Cursor-compatible .mdc rule files)
# Rules with "alwaysApply: true" are automatically injected into every prompt.
rules:
  - ~/.cursor/rules
  - .cursor/rules

# MCP (Model Context Protocol) servers
# Each server provides additional tools the agent can invoke.
# mcp_servers:
#   # Standard stdio-based MCP server
#   filesystem:
#     command: npx
#     args:
#       - -y
#       - "@modelcontextprotocol/server-filesystem"
#       - /path/to/workspace
#   github:
#     command: npx
#     args:
#       - -y
#       - "@modelcontextprotocol/server-github"
#   # HTTP-based MCP server with authentication
#   dolphin:
#     type: streamableHttp
#     url: http://10.9.92.215:9666/mcp
#     headers:
#       Authorization: JWT your-jwt-token-here
#   # Simple HTTP MCP server
#   custom-api:
#     url: http://localhost:3000/mcp

# Shared memory (tdai_agent_mem) — multi-machine / multi-agent memory hub.
# When enabled, code-agent:
#   - recalls relevant memories (L1 facts + L2 scenario index + L3 persona)
#     before each task and injects them into the system prompt,
#   - captures each finished task exchange into L0 (the hub distills
#     L0 → L1 → L2 → L3 automatically),
#   - registers tdai_memory_search / tdai_conversation_search / tdai_read_file /
#     tdai_memory_write tools so the LLM can query/write memory directly.
#
# Credentials can also live in ~/.codeagent/mcp.json under
# `mcpServers.tdai_agent_mem` (url + Authorization Bearer user key +
# x-tdai-service-id header + username/teamId/agentId/userId).
# memory:
#   enabled: true
#   endpoint: http://10.9.114.25:8420
#   api_key: sk-mem-your-user-key
#   service_id: default
#   username: zrh            # your agent user on the memory platform
#   team_id: team-xxx
#   agent_id: agt-xxx
#   user_id: usr-xxx
#   session_id: ""           # optional; omit to aggregate L0/L1 across sessions
#   recall: true             # auto-recall before each task (default true)
#   capture: true            # auto-capture L0 after each task (default true)

# CodeAgent Configuration Template
# Copy this file to one of the following locations:
#   - ./config.yaml              (project-level, highest priority)
#   - ~/.agent/config.yaml       (global, shared across projects; legacy
#                                 ~/.codeagent/config.yaml is auto-migrated on start)
#
# Global instructions / rules (Claude `CLAUDE.md` style, always active):
#   - ~/.agent/agent.md              (global)
#   - <project>/.agent/agent.md      (project-level, loaded after the global one)
#
# Model definitions are in models.json (CodeBuddy-compatible format).
#   - ~/.agent/models.json       (global)
#   - ./models.json              (project-level)
#
# You can override specific model params in the profiles section below.
# profile values take precedence over models.json entries.

# Active profile — must match an "id" in models.json
active_profile: openai

# Override model params here (optional, takes precedence over models.json)
# profiles:
#   deepseek-v4-pro:
#     temperature: 0.5
#     top_k: 40

# Model routing — automatically select & switch models per prompt within a session.
# Scenarios are detected from the prompt: 'vision' | 'reasoning' | 'fast'.
# Each scenario maps to a model id (models.json) or a profile name (above).
# When this section is present, routing is enabled by default (set enabled: false to disable).
# model_routing:
#   enabled: true
#   default: deepseek-v4-flash          # fallback model for unmatched scenarios
#   fallback: gpt-5.6-luna               # 保底模型 (guaranteed model): auto-switched
#                                        # when the scenario/default model hits an API
#                                        # access timeout OR a rate limit (HTTP 429 /
#                                        # TPM-RPM quota), then the request is retried.
#                                        # A background probe switches back to the
#                                        # primary model as soon as it answers again
#                                        # (a throttled primary must answer for real,
#                                        # not merely return 429).
#                                        # Use a NON-thinking model here: a thinking
#                                        # 保底 model can loop on its own reasoning and
#                                        # answer nothing (observed with hy3).
#   fallback_probe_interval_s: 30        # how often the background probe re-checks the
#                                        # primary model (default: 30s, backing off to 120s)
#   scenarios:
#     reasoning: deepseek-v4-pro        # complex refactor/debug/architecture tasks
#     vision: deepseek-v4-flash-vision-exp  # image/screenshot understanding
#     fast: deepseek-v4-flash           # simple/quick tasks

# Agent settings
agent:
  max_steps: 999999
  max_context_tokens: 200000
  temperature: 0
  # top_k: 1            # Top-K sampling (0/omitted = provider default, not sent).
                        # Pin to a fixed value (e.g. top_k: 1 with temperature: 0)
                        # for reproducible benchmark runs.
  step_timeout: 120000    # 2 min (reasoning models need more time for tool execution)
  task_timeout: 600000     # 10 min

# Skills directories (Cursor-compatible SKILL.md files)
# The agent scans these directories for skill definitions.
# Each skill is a directory containing a SKILL.md file with frontmatter.
skills:
  - ~/.agent/skills
  - ~/.agent/skills-cursor
  - .agent/skills

# Rules directories (Cursor-compatible .mdc rule files).
# Rules with "alwaysApply: true" are automatically injected into every prompt.
# NOTE: a single ~/.agent/agent.md (or <project>/.agent/agent.md) is the
# recommended way to keep always-on instructions; .mdc dirs remain supported.
rules:
  - ~/.agent/rules
  - .agent/rules

# MCP (Model Context Protocol) servers
# Each server provides additional tools the agent can invoke.
# mcp_servers:
#   # Standard stdio-based MCP server
#   filesystem:
#     command: npx
#     args:
#       - -y
#       - "@modelcontextprotocol/server-filesystem"
#       - /path/to/workspace
#   github:
#     command: npx
#     args:
#       - -y
#       - "@modelcontextprotocol/server-github"
#   # HTTP-based MCP server with authentication
#   dolphin:
#     type: streamableHttp
#     url: http://10.9.92.215:9666/mcp
#     headers:
#       Authorization: JWT your-jwt-token-here
#   # Simple HTTP MCP server
#   custom-api:
#     url: http://localhost:3000/mcp

# LLM observability — Langfuse tracing (optional)
#
# When enabled, every agent run is exported to Langfuse as one trace:
#   agent-task (root)  →  agent-step-N  →  llm-call (generation: model,
#                                          params, tokens)
#                                       →  tool:<name> (arguments, result)
# Parallel subagents appear as `agent` observations in the Agent Graph.
#
# Setup (either the env vars OR this section):
#   1. Create a project at https://cloud.langfuse.com (or self-host) and copy
#      the API keys from Settings -> API Keys.
#   2. Either export
#        LANGFUSE_PUBLIC_KEY=pk-lf-...
#        LANGFUSE_SECRET_KEY=sk-lf-...
#        LANGFUSE_BASE_URL=https://cloud.langfuse.com   # EU; US: us.cloud.langfuse.com
#      or fill in the section below. Env vars take precedence.
#   3. Run as usual. `--tracing off` disables it for one run.
#
# Privacy: prompts, tool arguments and results are sent as trace input/output.
# Set capture_content: false to send only names, models, token usage, timings
# and error levels (no content at all). Secrets (API keys, bearer tokens, JWTs)
# are masked automatically in every traced string.
#
# tracing:
#   enabled: true
#   public_key: pk-lf-your-public-key
#   secret_key: sk-lf-your-secret-key
#   base_url: https://cloud.langfuse.com   # or https://us.cloud.langfuse.com, or self-hosted
#   environment: local                     # groups traces by deploy target
#   release: 0.3.39                        # defaults to the agent version
#   capture_content: true                  # false = metadata only, no prompts/outputs
#   user_id: zrh                           # defaults to $USER
#   tags:
#     - code-agent

# Agent self-evolution (RSI) — let the agent find its own defects from its run
# history and release the fix through a checked gate.
#
#   agent_self_scan : reads <agent home>/tasks/*.json and returns FACTS — tool
#                     call/failure histograms, failures grouped by normalized
#                     error, run signals (user /btw corrections, model fallbacks,
#                     context overflows, reasoning loops, step-limit hits,
#                     unknown tools), slowest/costliest tasks. Read-only; session
#                     transcripts are never read.
#   agent_release   : version bump -> npm run release_scripts -> pack -> smoke the
#                     built CLI -> git commit -> optional push. Aborts at the
#                     first failure (no commit on red tests), never uses --force /
#                     --amend / --no-verify, and restores package.json if it
#                     aborts before committing.
#
# Method (evidence -> judgement -> minimal fix -> test -> release) is in
# docs/self-evolve.md and is injected into the system prompt when enabled.
#
# Quick look at the evidence without an LLM call:
#   code-agent --self-scan 30
#
# self_update:
#   enabled: true            # register agent_self_scan (read-only, safe)
#   allow_release: false     # register agent_release (writes the repo, commits)
#   allow_push: false        # ...and let it push (requires allow_release: true)
#   evidence_days: 14        # look-back window for run evidence
#   evidence_tasks: 200      # hard cap on task logs scanned (newest first)
#   remote: origin           # push target
#   release_scripts: ["typecheck", "test", "pack"]
#   install_command: ""      # optional extra command after the scripts (e.g. npm link)

# Shared memory (tdai_agent_mem) — multi-machine / multi-agent memory hub.
# When enabled, code-agent:
#   - recalls relevant memories (L1 facts + L2 scenario index + L3 persona)
#     before each task and injects them into the system prompt,
#   - captures each finished task exchange into L0 (the hub distills
#     L0 → L1 → L2 → L3 automatically),
#   - registers tdai_memory_search / tdai_conversation_search / tdai_read_file /
#     tdai_memory_write tools so the LLM can query/write memory directly.
#
# Credentials can also live in ~/.agent/mcp.json under
# `mcpServers.tdai_agent_mem` (url + Authorization Bearer user key +
# x-tdai-service-id header + username/teamId/agentId/userId).
#
# For reproducible benchmarks, pin sampling with
#   agent-cli --temperature 0 --top-k 1 --memory off "task"
# so temperature/top-k/memory are fixed across runs.
# memory:
#   enabled: true
#   endpoint: http://10.9.114.25:8420
#   api_key: sk-mem-your-user-key
#   service_id: default
#   username: zrh            # your agent user on the memory platform
#   team_id: team-xxx
#   agent_id: agt-xxx
#   user_id: usr-xxx
#   session_id: ""           # optional; omit to aggregate L0/L1 across sessions
#   recall: true             # auto-recall before each task (default true)
#   capture: true            # auto-capture L0 after each task (default true)
